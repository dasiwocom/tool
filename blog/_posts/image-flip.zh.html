<h2>翻转与旋转的用处</h2>
<p>拍的视频截图方向不对、合成素材时镜像翻过来才合适、设计稿要求某个元素水平反转——这类“换个方向”的调整用工具做最快，几秒出结果。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/image-flip/index.html">图片翻转旋转工具</a>：</p>
<ul>
    <li><strong>水平翻转</strong>：左右镜像。</li>
    <li><strong>垂直翻转</strong>：上下镜像。</li>
    <li><strong>双向镜像</strong>：水平和垂直同时翻转。</li>
    <li><strong>按角度旋转</strong>：输入角度自由旋转，修正拍摄方向。</li>
</ul>
<p>选择方向后点击按钮，输出结果即可下载。</p>

<h2>小提示</h2>
<p>条形码、文字类图片翻转后会被镜像（内容随之颠倒），不是 bug；需要“只转方向不动内容”时，优先用旋转而不是翻转。全部处理在浏览器本地完成。</p>
