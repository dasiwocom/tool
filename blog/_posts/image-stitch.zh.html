<h2>什么时候拼接图片</h2>
<p>聊天截图一条条发太乱，拼成一张长图便于分享；做对比图、流程示意图、海报碎片合成，都需要把多张图拼在一起。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/image-stitch/index.html">图片拼接工具</a>：</p>
<ol>
    <li><strong>选择多张图片</strong>：按顺序添加要拼接的图片。</li>
    <li><strong>选择方向</strong>：水平拼接（横向排开）或垂直拼接（上下排列）。</li>
    <li><strong>设置间隙</strong>：可在图片之间留出指定像素的间距。</li>
    <li><strong>拼接下载</strong>：一键合成一张长图并下载。</li>
</ol>

<h2>小提示</h2>
<p>拼接方向与图片列表顺序直接决定结果，添加前先想好“从左到右”还是“从上到下”。生成的长图保持各原图比例，适合直接发到社交平台或文档里。</p>
