<h2>用多张图片做 GIF</h2>
<p>表情包、演示轮播、操作录屏合成，或是一组照片做成简单动画——把多张静态图合成为 GIF 是这类需求最直接的办法。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/gif-maker/index.html">GIF 制作工具</a>：</p>
<ol>
    <li><strong>选择多张图片</strong>：按播放顺序添加帧图。</li>
    <li><strong>设置输出尺寸</strong>：调整生成 GIF 的宽度，控制体积与清晰度。</li>
    <li><strong>设置帧延迟</strong>：每一帧停留的毫秒数，决定动画快慢。</li>
    <li><strong>生成下载</strong>：一键合成动图并保存。</li>
</ol>

<h2>小提示</h2>
<p>帧图建议先裁成统一尺寸，生成的动图会更整齐；延迟越大动画越慢。颜色丰富的图转成 GIF 体积会偏大，必要时先把图压小再合成。生成过程全程在浏览器本地完成。</p>
