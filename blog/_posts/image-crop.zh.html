<h2>为什么要裁剪图片</h2>
<p>截图带了一大堆无关区域、照片主体偏了、要裁掉扫描件边缘——保留需要的部分，去掉多余的部分，就是裁剪最常见的用途。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/image-crop/index.html">图片裁剪工具</a>：</p>
<ol>
    <li><strong>选择图片</strong>：上传需要处理的图片。</li>
    <li><strong>框选区域</strong>：在预览图上拖动，框出你想保留的范围。</li>
    <li><strong>裁剪下载</strong>：点击裁剪，得到仅包含选中区域的图片并下载。</li>
</ol>

<h2>实用场景与新技巧</h2>
<ul>
    <li><strong>头像与配图</strong>：裁出正方形或所需比例，直接使用。</li>
    <li><strong>去边去噪</strong>：裁掉四周空白或多余的边缘。</li>
    <li><strong>局部放大</strong>：先裁出目标区域，再配合按宽缩放调整最终尺寸。</li>
</ul>
<p>裁剪在浏览器本地完成，图片不会上传到服务器。</p>
