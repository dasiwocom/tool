<h2>摩斯码是什么</h2>
<p>摩斯码用“点”“划”和间隔表示字母与数字，是最经典的远距离通信编码。今天更多见于业余无线电、应急通信，以及想学一种“神秘密码”的兴趣场景。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/morse/index.html">摩斯码转换工具</a>：</p>
<ul>
    <li><strong>文本转摩斯</strong>：输入英文或数字，即时得到对应的点划序列，字母之间自动留间隔。</li>
    <li><strong>摩斯转文本</strong>：把收到的点划串转换成可读文本。</li>
    <li><strong>方向切换</strong>：一键在两个方向之间切换。</li>
</ul>

<h2>学习建议</h2>
<p>先从“单字母”出发，熟悉高频字母（E、T、A、O 等）的点划特征，再练习连读。转换工具用来对照校对很顺手：听不懂的码先转成文本，再对照着练听力。</p>
