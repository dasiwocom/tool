<h2>圆形图片用在哪里</h2>
<p>平台头像、通讯录标识、圆形徽章、成员列表——圆形是这些场景最通用的形态。直接把一张方形照片裁成圆形，透明背景的 PNG 放哪都自然。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/image-circular-crop/index.html">圆形裁剪工具</a>：</p>
<ol>
    <li><strong>选择图片</strong>：上传要处理的图片。</li>
    <li><strong>设置输出尺寸</strong>：指定生成圆形图片的边长（像素）。</li>
    <li><strong>选择填充方式</strong>：等比适配（保持比例，可能留白边）或铺满（填满圆形，可能裁掉边缘）。</li>
    <li><strong>生成下载</strong>：得到透明背景的圆形 PNG，保存即用。</li>
</ol>

<h2>小提示</h2>
<p>做头像选“等比适配”更自然；需要圆形内充满时再选“铺满”。生成的 PNG 带透明通道，放到任意底色背景上都干净。</p>
