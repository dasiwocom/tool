<h2>什么时候需要调整图片尺寸</h2>
<p>平台对图片有严格的尺寸限制、网页配图要得知合适的宽度、发群聊怕原图太大——把一张 4000px 的图缩到 800px，体积和加载速度都会显著改善。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/image-resize/index.html">图片缩放工具</a>：</p>
<ul>
    <li><strong>按百分比缩放</strong>：输入 50% 即缩到一半，适合“整体缩小”。</li>
    <li><strong>按指定宽度</strong>：直接填目标宽度，高度按比例自动保持，不会变形。</li>
    <li><strong>下载结果</strong>：处理完成后下载调整好的图片。</li>
</ul>

<h2>小提示</h2>
<p>只给出“宽高比”概念：网页横幅常用 1200–1600px 宽，社媒封面通常要求更小；放大的场景因为原图分辨率有限，别指望太大幅度提升清晰度。</p>
