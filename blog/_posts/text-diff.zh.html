<h2>什么时候做文本对比</h2>
<p>审稿改稿、版本备份回滚、两份配置对比、甲乙方交付文档核对——都离不开“到底改了哪里”。肉眼比对又长又容易漏，用工具把差异标出来是最快的方式。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/text-diff/index.html">文本对比工具</a>：</p>
<ol>
    <li>在“原文”里粘贴修改前的文本。</li>
    <li>在“新文本”里粘贴修改后的版本。</li>
    <li>点击对比，工具自动找出两边的差异，增删和替换的部分一目了然。</li>
</ol>

<h2>怎么看结果</h2>
<p>被新增的行、被删除的行、内容替换的区域都会用不同样式标出。逐条确认后，再决定这些差异是预期改动还是误改。对比结果按行输出，长文档也能快速定位到具体位置。所有处理都在浏览器本地完成。</p>
