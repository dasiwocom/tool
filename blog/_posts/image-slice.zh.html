<h2>为什么要切图</h2>
<p>发一张图会被平台压缩，切成九宫格反而更清晰更适合排版；大地图、长截图要分块浏览；游戏素材和小伙伴协作时要按网格拆图——切图工具把这些需求几秒搞定。</p>

<h2>这个工具怎么用</h2>
<p>打开 <a href="../../tools/image-slice/index.html">图片切片工具</a>：</p>
<ol>
    <li><strong>选择图片</strong>：上传要切分的原图。</li>
    <li><strong>设置行列</strong>：指定分成几行几列，工具会均匀切分。</li>
    <li><strong>一键切分</strong>：得到多张尺寸一致的小图。</li>
</ol>

<h2>常见用法</h2>
<ul>
    <li><strong>九宫格拼图</strong>：3×3 发布到社交平台，单图更清晰。</li>
    <li><strong>长图分块</strong>：把超宽超高的截图切成便于阅读的小段。</li>
    <li><strong>素材拆图</strong>：把整版素材按固定行列拆成可复用的子资源。</li>
</ul>
<p>切分结果可按单张或整体使用，全程在浏览器本地处理。</p>
