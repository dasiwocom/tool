<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){try{
  var t=localStorage.getItem("toolbox-theme");
  var l=localStorage.getItem("toolbox-lang");
  var d=document.documentElement;
  if(t==="dark"){d.setAttribute("data-theme","dark")}
  if(l==="en"||l==="zh"){d.setAttribute("lang",l)}
  if(l!=="en"){d.classList.add("i18n-pending")}
}catch(e){}})();
setTimeout(function(){try{document.documentElement.classList.remove("i18n-pending")}catch(e){}},1500);
</script>
<title>Image Crop · ToolBox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='5' width='22' height='22' rx='6' fill='%230071e3'/></svg>">
<script src="../../core.js?v=20260918j"></script>
<link rel="stylesheet" href="../../styles.css?v=20260918j">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="../../index.html">
            <span class="brand-mark">T</span>
            <span data-i18n="siteName">ToolBox</span>
        </a>
        <nav class="site-nav">
            <a href="../../index.html" data-i18n="home">Home</a>
            <a href="../../changelog/index.html" data-i18n="changelog">Changelog</a>
            <a href="../../download/index.html" data-i18n="download">Download</a>
            <a href="../../contact/index.html" data-i18n="contact">Contact</a>
        </nav>
        <div class="header-actions">
            <button id="langToggle" class="icon-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
                <span class="btn-label">English</span>
            </button>
            <button id="themeToggle" class="icon-btn"><span id="themeIcon"></span></button>
            <button id="menuToggle" class="icon-btn menu-btn" aria-label="Menu" aria-expanded="false" data-i18n-title="menu" title="Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                <span class="btn-label"></span>
            </button>
        </div>
    </div>
</header>

<main class="tool-page">
    <div class="tool-head" data-tool-key="imageCrop">
        <h1>Image Crop</h1>
        <p data-i18n="imageCropDesc">Crop a region out of an image</p>
    </div>

    <div class="section">
        <div class="section-label" data-i18n="chooseImage">Choose an image</div>
        <input type="file" id="file" accept="image/*" class="code" style="font-size:16px;">
    </div>

    <div class="section" id="stageWrap" hidden>
        <div class="section-label" data-i18n="cropHint">Drag on the image to select an area</div>
        <div id="stage" style="position:relative; display:inline-block; max-width:100%; user-select:none; cursor:crosshair;">
            <img id="stageImg" style="display:block; max-width:100%; height:auto; border-radius:10px;">
            <div id="cropBox" style="position:absolute; border:2px solid var(--accent); background:rgba(0,113,227,.15); display:none; pointer-events:none;"></div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-top:16px; max-width:480px;">
            <label><span class="hint">X</span><input id="cropX" type="number" class="code" style="width:100%;"></label>
            <label><span class="hint">Y</span><input id="cropY" type="number" class="code" style="width:100%;"></label>
            <label><span class="hint">W</span><input id="cropW" type="number" class="code" style="width:100%;"></label>
            <label><span class="hint">H</span><input id="cropH" type="number" class="code" style="width:100%;"></label>
        </div>

        <div class="btn-row">
            <button class="btn btn-primary" id="cropBtn" data-i18n="cropBtn">Crop</button>
        </div>
    </div>

    <div class="section" id="cropResult" hidden>
        <div class="section-label" data-i18n="toolResult">Result</div>
        <img id="preview" style="max-width:100%; border-radius:10px; margin-bottom:16px;">
        <div class="btn-row">
            <a class="btn btn-primary" id="download" download="cropped.png" data-i18n="download">Download</a>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-links">
            <a href="../../index.html" data-i18n="home">Home</a>
            <a href="../../changelog/index.html" data-i18n="changelog">Changelog</a>
            <a href="../../download/index.html" data-i18n="download">Download</a>
            <a href="../../contact/index.html" data-i18n="contact">Contact</a>
        </div>
        <div class="footer-brand"><span class="footer-mark">T</span> <span data-i18n="siteName">ToolBox</span></div>
        <p class="footer-note" data-i18n="footer">All processing happens in your browser</p>
        <p class="footer-note">© 2026 ToolBox</p>
    </div>
</footer>
<div class="toast" id="toast"></div>
<div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close-drawer></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="drawer-head">
            <a class="brand" href="../../index.html">
                <span class="brand-mark">T</span>
                <span data-i18n="siteName">ToolBox</span>
            </a>
            <button class="drawer-close" data-close-drawer>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
        </div>
        <nav class="drawer-nav">
            <a href="../../index.html" data-i18n="home">Home</a>
            <a href="../../changelog/index.html" data-i18n="changelog">Changelog</a>
            <a href="../../download/index.html" data-i18n="download">Download</a>
            <a href="../../contact/index.html" data-i18n="contact">Contact</a>
        </nav>
        <div class="drawer-foot" data-i18n="footer"></div>
    </div>
</div>

<script src="app.js?v=20260918j"></script>
</body>
</html>
