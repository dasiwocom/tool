<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){try{
  var t=localStorage.getItem("toolbox-theme");
  var l=localStorage.getItem("toolbox-lang");
  var d=document.documentElement;
  if(t==="dark"){d.setAttribute("data-theme","dark")}
  if(l==="en"||l==="zh"){d.setAttribute("lang",l)}
}catch(e){}})();
</script>
<title>Text Counter · ToolBox</title>
<link rel="stylesheet" href="../../styles.css?v=20260918f">
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="../../index.html">
            <span class="brand-mark">T</span>
            <span data-i18n="siteName">ToolBox</span>
        </a>
        <nav class="site-nav">
            <a href="../../index.html" data-i18n="home">Home</a>
            <a href="../../changelog/index.html" data-i18n="changelog">Changelog</a>
            <a href="../../download/index.html" data-i18n="download">Download</a>
        </nav>
        <div class="header-actions">

            <button id="langToggle" class="icon-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
                <span class="btn-label">English</span>
            </button>
            <button id="themeToggle" class="icon-btn"><span id="themeIcon"></span></button>
                    <button id="menuToggle" class="icon-btn menu-btn" aria-label="Menu" aria-expanded="false" data-i18n-title="menu" title="Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                <span class="btn-label"></span>
            </button>
        </div>
    </div>
</header>

<main class="tool-page">
    <div class="tool-head" data-tool-key="stats">
        <h1>Text Counter</h1>
        <p>Count characters, words, and lines</p>
    </div>

    <div class="section">
        <div class="section-label"><span data-i18n="input">Input</span><button class="btn-ghost" id="clearNoSave">✕</button></div>
        <textarea id="input" rows="9" spellcheck="false" placeholder="Type or paste text here…"></textarea>
    </div>

    <div class="section">
        <div class="section-label"><span data-i18n="output">Output</span></div>
        <div class="stat-grid">
            <div class="stat"><div class="value" id="chars">0</div><div class="label" data-i18n="statChars">Characters</div></div>
            <div class="stat"><div class="value" id="words">0</div><div class="label" data-i18n="statWords">Words</div></div>
            <div class="stat"><div class="value" id="lines">0</div><div class="label" data-i18n="statLines">Lines</div></div>
            <div class="stat"><div class="value" id="nospace">0</div><div class="label" data-i18n="statNonSpace">Non-space</div></div>
            <div class="stat"><div class="value" id="cjk">0</div><div class="label" data-i18n="statCJK">Chinese chars</div></div>
            <div class="stat"><div class="value" id="bytes">0</div><div class="label" data-i18n="statBytes">UTF-8 bytes</div></div>
        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="footer-links">
            <a href="../../index.html" data-i18n="home">Home</a>
            <a href="../../changelog/index.html" data-i18n="changelog">Changelog</a>
            <a href="../../download/index.html" data-i18n="download">Download</a>
        </div>
        <div class="footer-brand"><span class="footer-mark">T</span> <span data-i18n="siteName">ToolBox</span></div>
        <p class="footer-note" data-i18n="footer">All processing happens in your browser</p>
        <p class="footer-note">© 2026 ToolBox</p>
    </div>
</footer>
<div class="toast" id="toast"></div>
<div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close-drawer></div>
    <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="drawer-head">
            <a class="brand" href="../../index.html">
                <span class="brand-mark">T</span>
                <span data-i18n="siteName">ToolBox</span>
            </a>
            <button class="drawer-close" data-close-drawer>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
        </div>
        <nav class="drawer-nav">
            <a href="../../index.html" class="active" data-i18n="home">Home</a>
            <a href="../../changelog/index.html" data-i18n="changelog">Changelog</a>
            <a href="../../download/index.html" data-i18n="download">Download</a>
        </nav>
        <div class="drawer-foot" data-i18n="footer"></div>
    </div>
</div>

<script src="../../core.js?v=20260918f"></script>
<script src="app.js?v=20260918f"></script>
</body>
</html>
