<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){try{
  var t=localStorage.getItem("toolbox-theme");
  var l=localStorage.getItem("toolbox-lang");
  var d=document.documentElement;
  if(t==="dark"){d.setAttribute("data-theme","dark")}
  if(l==="en"||l==="zh"){d.setAttribute("lang",l)}
  if(l!=="en"){d.classList.add("i18n-pending")}
}catch(e){}})();
setTimeout(function(){try{document.documentElement.classList.remove("i18n-pending")}catch(e){}},1500);
</script>

<main class="tool-page">
    <div class="tool-head" data-tool-key="uuid">
        <h1>UUID Generator</h1>
        <p>Generate v4 UUIDs in bulk</p>
    </div>

    <div class="section">
        <div class="section-label" data-i18n="countUUID">Number of UUIDs</div>
        <div class="range-row">
            <input type="range" id="count" min="1" max="100" value="5">
            <span class="value" id="countLabel">5</span>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" data-i18n="generate" id="generate">Generate</button>
            <button class="btn btn-secondary" data-i18n="copyAll" id="copyAll">Copy All</button>
        </div>
    </div>

    <div class="section">
        <div class="section-label"><span data-i18n="uuidResult">Generated IDs</span><span class="hint" data-i18n="clickToCopy">Click to copy</span></div>
        <div class="item-list" id="list"></div>
    </div>
</main>
